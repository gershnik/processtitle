name: Test

on: 
  push:
    branches: 
      - '*'
      - '*/**'
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'Acknowledgments.md'
      - '.github/workflows/artifacts.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/test-extra.yml'
  workflow_dispatch:


jobs:
  matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
        python-version: [
          "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t",
          "pypy-3.10", "pypy-3.11",
          "graalpy-25.0"
        ]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # avoid setup-python noise on macOS
      - name: Clear pre-baked pip cache
        if: runner.os == 'macOS'
        run: rm -rf ~/Library/Caches/pip

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: ${{matrix.python-version}}

      - name: Test
        if: runner.os != 'Windows'
        run: |
          echo "::group::Setup Environment"
          ${{ steps.setup-python.outputs.python-path }} -m venv .venv
          source .venv/bin/activate 
          pip install pytest
          echo "::endgroup::"
          echo "::group::Build"
          pip install -v .
          echo "::endgroup::"
          pytest -vv -s --color=yes

      - name: Test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo "::group::Setup Environment"
          ${{ steps.setup-python.outputs.python-path }} -m venv .venv
          . .venv\Scripts\activate
          pip install pytest
          echo "::endgroup::"
          echo "::group::Build"
          pip install -v .
          echo "::endgroup::"
          pytest -vv -s --color=yes
